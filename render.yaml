services:
  - type: web
    name: friday-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      # ⚠️  Do NOT set FRIDAY_MODE=demo unless you explicitly want a fully
      # public, UNAUTHENTICATED instance: in demo mode every request is treated
      # as the owner, so anyone who finds the URL can read your todos, memories,
      # notes and career profile, and burn your Groq/Gemini API credits.
      # With FRIDAY_MODE unset, the API requires FRIDAY_API_TOKEN sent as the
      # X-FRIDAY-Token header (token generated below).
      # If you truly want a public demo, uncomment these two lines:
      # - key: FRIDAY_MODE
      #   value: demo
      - key: ALLOWED_ORIGINS
        value: "https://friday-ui-blush.vercel.app,https://friday-oryyaypj7-prathvisahus-projects.vercel.app,http://localhost:5173,http://localhost:8080"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: FRIDAY_API_TOKEN
        generateValue: true
        # Master owner authentication token: used for private remote administration
        # (entered via runtime session unlock) and internal Docker orchestration.
        # The public Vercel frontend safely accesses the public recruiter demo tier without hardcoded secrets.
